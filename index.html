<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧟 공부 좀비 퇴치</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1020;
    color:white;
}

button{
    border:0;
    border-radius:12px;
    padding:12px 18px;
    margin:5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover:not(:disabled){
    transform:scale(1.03);
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

.hidden{
    display:none!important;
}

.screen{
    min-height:100vh;
    padding:20px;
}

/* 시작 */
.startBox{
    width:min(700px,95%);
    margin:80px auto;
    background:#182238;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.title{
    font-size:46px;
}

.subtitle{
    color:#bdc7d8;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:10px;
    border:2px solid #394866;
    background:#0d1424;
    color:white;
    font-size:16px;
}

.mainBtn{
    width:100%;
    background:#4c7dff;
    color:white;
}

/* 상단 */
.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    background:#182238;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
}

.stats{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.stat{
    background:#0f1729;
    padding:9px 12px;
    border-radius:10px;
}

/* 메인 메뉴 */
.menuGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
}

.menuButton{
    min-height:110px;
    background:#1d2d4b;
    color:white;
}

/* 카드 */
.cardGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:#182238;
    padding:20px;
    border-radius:18px;
}

.price{
    color:#ffd45a;
}

/* 맵 */
.gameWorld{
    position:relative;
    width:100%;
    max-width:1000px;
    height:600px;
    margin:auto;
    background:
        linear-gradient(#31435f 1px,transparent 1px),
        linear-gradient(90deg,#31435f 1px,transparent 1px);
    background-size:40px 40px;
    background-color:#263750;
    border:4px solid #435a7d;
    border-radius:20px;
    overflow:hidden;
}

.school{
    position:absolute;
    background:#d7dce6;
    color:#101827;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    text-align:center;
}

.worldPlayer{
    position:absolute;
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:43px;
    z-index:10;
    user-select:none;
}

.worldZombie{
    position:absolute;
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    z-index:8;
}

/* 1인칭 */
.firstPersonView{
    position:relative;
    width:100%;
    height:360px;
    overflow:hidden;
    border-radius:20px;
    background:
        linear-gradient(
            to bottom,
            #17243b 0%,
            #273b5b 55%,
            #191c23 56%,
            #08090c 100%
        );
    border:3px solid #42587d;
    margin-bottom:18px;
}

/* 십자 조준점 */
.firstPersonView::before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    background:white;
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:15;
    box-shadow:
        0 0 0 2px rgba(0,0,0,.5);
}

/* 바닥 */
.firstPersonView::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:38%;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.03),
            rgba(255,255,255,.03) 2px,
            transparent 2px,
            transparent 25px
        );
}

/* 1인칭 좀비 */
.fpZombie{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    font-size:130px;
    z-index:10;
    transition:.2s;
    filter:drop-shadow(0 8px 8px rgba(0,0,0,.5));
}

/* 무기 */
.fpWeapon{
    position:absolute;
    right:9%;
    bottom:-5px;
    font-size:125px;
    z-index:20;
    transform:rotate(-8deg);
    filter:drop-shadow(0 5px 5px rgba(0,0,0,.5));
}

/* 피격 효과 */
.hitFlash{
    animation:hit .25s;
}

@keyframes hit{
    0%{filter:brightness(1);}
    50%{filter:brightness(2);}
    100%{filter:brightness(1);}
}

/* 전투 */
.battleBox{
    max-width:1100px;
    margin:auto;
    background:#182238;
    padding:20px;
    border-radius:22px;
}

.battleInfo{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.fighter{
    background:#101827;
    padding:15px;
    border-radius:15px;
}

.hpBar{
    width:100%;
    height:24px;
    background:#333d50;
    border-radius:20px;
    overflow:hidden;
    margin:8px 0;
}

.hpFill{
    height:100%;
    width:100%;
    background:#3fd47b;
    transition:width .25s;
}

.enemyBar .hpFill{
    background:#e85b63;
}

.questionBox{
    background:#101827;
    border-radius:18px;
    padding:20px;
    margin-top:15px;
}

.questionText{
    font-size:25px;
    line-height:1.5;
    margin:15px 0;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.answerBtn{
    min-height:65px;
    background:#304665;
    color:white;
}

.answerBtn:hover:not(:disabled){
    background:#45628d;
}

.battleButtons{
    text-align:center;
    margin-top:15px;
}

.skillBtn{
    background:#945af0;
    color:white;
}

.itemBtn{
    background:#32a76c;
    color:white;
}

/* 모달 */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
}

.modalBox{
    width:min(600px,92%);
    background:#182238;
    padding:25px;
    border-radius:20px;
    text-align:center;
}

.success{
    color:#63e58c;
}

.danger{
    color:#ff7373;
}

.info{
    color:#8fb5ff;
}

@media(max-width:700px){
    .title{
        font-size:34px;
    }

    .answers,
    .battleInfo{
        grid-template-columns:1fr;
    }

    .gameWorld{
        height:450px;
    }

    .fpWeapon{
        right:3%;
        font-size:95px;
    }

    .fpZombie{
        font-size:100px;
    }
}
</style>
</head>

<body>

<!-- ================= START ================= -->

<section id="startScreen" class="screen">

    <div class="startBox">

        <div class="title">🧟 공부 좀비 퇴치</div>

        <div class="subtitle">
            공부하고 좀비를 물리쳐 학교를 구하자!
        </div>

            id="nicknameInput"
            placeholder="닉네임을 입력하세요">

        <select id="difficultySelect">

            <option value="easy">
                🟢 쉬움
            </option>

            <option value="normal" selected>
                🟡 보통
            </option>

            <option value="hard">
                🔴 어려움
            </option>

            <option value="hell">
                💀 지옥
            </option>

        </select>

        <button
            class="mainBtn"
            onclick="startGame()">
            ▶ 게임 시작
        </button>

        <p id="startMessage"></p>

    </div>

</section>

<!-- ================= MAIN ================= -->

<section id="mainScreen" class="screen hidden">

    <div class="topbar">

        <b>🧟 공부 좀비 퇴치</b>

            </div>

                ⭐ Lv.<span id="levelText">1</span>
            </div>

                ✨ <span id="xpText">0</span>/100
            </div>

            <div class="stat">
                🪙 <span id="coinText">0</span>
            </div>

        </div>

    </div>

    <div class="menuGrid">

        <button class="menuButton" onclick="showMap()">
            🗺️<br>학교 맵
        </button>

        <button class="menuButton" onclick="showCharacters()">
            🧑‍🎤<br>캐릭터
        </button>

        <button class="menuButton" onclick="showShop()">
            🛒<br>무기
        </button>

        <button class="menuButton" onclick="showQuest()">
            🎯<br>퀘스트
        </button>

        <button class="menuButton" onclick="showAchievements()">
            🏆<br>업적
        </button>

        <button class="menuButton" onclick="showRanking()">
            🥇<br>랭킹
        </button>

        <button class="menuButton" onclick="showStats()">
            📈<br>학습 통계
        </button>

        <button class="menuButton" onclick="showAttendance()">
            🎁<br>출석
        </button>

        <button class="menuButton" onclick="manualSave()">
            💾<br>저장
        </button>

        <button class="menuButton" onclick="resetGame()">
            ⚙️<br>초기화
        </button>

    </div>

</section>

<!-- ================= CONTENT ================= -->

<section id="contentScreen" class="screen hidden">

    <div class="topbar">

        <button onclick="goMain()">
            🏠 메인
        </button>

        <div class="stats">

            <div class="stat">
                ⭐ Lv.<span id="levelText2">1</span>
            </div>

            <div class="stat">
                ✨ <span id="xpText2">0</span>/100
            </div>

            <div class="stat">
                🪙 <span id="coinText2">0</span>
            </div>

        </div>

    </div>

    <div id="content"></div>

</section>

<!-- ================= BATTLE ================= -->

<section id="battleScreen" class="screen hidden">

    <div class="topbar">

        <button onclick="exitBattle()">
            🏠 나가기
        </button>

        <div class="stats">

            <div class="stat">
                ⭐ Lv.<span id="battleLevel">1</span>
            </div>

            <div class="stat">
                🔥 콤보 <span id="comboText">0</span>
            </div>

            <div class="stat">
                ⚡ 필살기 <span id="skillText">0</span>/5
            </div>

            <div class="stat">
                🪙 <span id="battleCoins">0</span>
            </div>

        </div>

    </div>

    <div class="battleBox">

        <!-- 1인칭 화면 -->

        <div id="firstPersonView"
             class="firstPersonView">

            <div id="fpZombie"
                 class="fpZombie">
                🧟
            </div>

            <div id="fpWeapon"
                 class="fpWeapon">
                🥊
            </div>

        </div>

        <!-- 정보 -->

        <div class="battleInfo">

            <div class="fighter">

                <h3>
                    🧑‍🎓
                    <span id="battleCharacterName">
                        기본 학생
                    </span>
                </h3>

                <div>
                    ❤️ 건강:
                    <span id="playerHpText">
                        100
                    </span>
                    /
                    <span id="playerMaxHpText">
                        100
                    </span>
                </div>

                <div class="hpBar">

                    <div
                        id="playerHpFill"
                        class="hpFill">
                    </div>

                </div>

                <div>
                    ⚔️ 공격력:
                    <span id="battleAttack">
                        20

                </div>

            </div>

            <div class="fighter enemyBar">

                <h3 id="zombieName">
                    🧟 일반 좀비
                </h3>

                <div>
                    🔥 레벨:
                    <span id="zombieLevelText">
                        100
                    </span>
                </div>

                <div>
                    ❤️ 건강:
                    <span id="zombieHpText">
                        50
                    </span>
                    /
                    <span id="zombieMaxHpText">
                        50
                    </span>
                </div>

                <div class="hpBar">

                    <div
                        id="zombieHpFill"
                        class="hpFill">
                    </div>

                </div>

            </div>

        </div>

        <!-- 문제 -->

        <div class="questionBox">

            <div class="info">
                📚 <span id="subjectText">
                    수학
                </span>
            </div>

            <div class="info">
                🎚️ <span id="questionDifficultyText">
                    보통

            </div>

                문제가 나옵니다.
            </div>

            <div id="answers"
                 class="answers">
            </div>

            <div class="battleButtons">

                <button
                    class="skillBtn"
                    onclick="useSkill()">
                    ⚡ 필살기
                </button>

                <button
                    class="itemBtn"
                    onclick="useHeal()">
                    🧪 회복약
                </button>

            </div>

            <p id="battleMessage"></p>

        </div>

    </div>

</section>

<!-- ================= MODAL ================= -->

<div id="modal"
     class="modal hidden">

    <div class="modalBox">

        <h2 id="modalTitle"></h2>

        <p id="modalText"></p>

        <button onclick="closeModal()">

        "startScreen"
    ).classList.add("hidden");

    updateUI();

function checkAttendance(){

    const today =
        new Date()
        .toISOString()
        .slice(0,10);

    if(game.lastAttendance !== today){

        game.attendance++;

        if(game.attendance > 7){
            game.attendance = 1;
        }

        const reward =
            10 + game.attendance * 5;

        game.coins += reward;

        game.lastAttendance = today;
    }
}

function spawnWorldZombies(){

    document.querySelectorAll(
        ".worldZombie"
    ).forEach(
        z => z.remove()
    );

            10

    for(
        let i=0;
        i<count;
        i++
    ){

                "div"
            );

        z.className =
            "worldZombie";

            zombies[type].emoji;

            80 +
            Math.random() *
            Math.max(
                100,
                world.clientWidth - 140
            );

        const y =
            130 +
            Math.random() *
            Math.max(
                100,
                world.clientHeight - 210
            );

        z.style.left =
            x + "px";

        z.style.top =
            y + "px";

        world.appendChild(z);

        worldZombies.push({

            element:z,
            type:type,
            x:x,
            y:y

        });
    }

/* =========================================================
   플레이어 이동
========================================================= */

function movePlayer(){

    const world =
        document.getElementById(
            "gameWorld"
        );

    if(
        world &&
        !document.getElementById(
            "contentScreen"
        ).classList.contains(
            "hidden"
        )
    ){

        const speed = 3;

        if(keys.w)
            playerY -= speed;

        if(keys.s)
            playerY += speed;

        if(keys.a)
            playerX -= speed;

        if(keys.d)
            playerX += speed;

        const maxX =
            world.clientWidth - 55;

        const maxY =
            world.clientHeight - 55;

        playerX =
            Math.max(
                0,
                Math.min(
                    maxX,
                    playerX
                )
            );

        playerY =
            Math.max(
                0,
                Math.min(
                    maxY,
                    playerY
                )
            );

        updateWorldPlayer();

        checkZombieCollision();
    }

    requestAnimationFrame(
        movePlayer
    );
}

function updateWorldPlayer(){

    const player =
        document.getElementById(
            "worldPlayer"
        );

    if(!player) return;

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";
}

/* =========================================================
   좀비 충돌
========================================================= */

function checkZombieCollision(){

    if(collisionLock) return;

    for(
        let i=0;
        i<worldZombies.length;
        i++
    ){

        const z =
            worldZombies[i];

        const dx =
            playerX - z.x;

        const dy =
            playerY - z.y;

        const distance =
            Math.sqrt(
                dx*dx +
                dy*dy
            );

        if(distance < 65){

            collisionLock = true;

            if(z.element){
                z.element.remove();
            }

            worldZombies.splice(i,1);

            startBattle(
                z.type
            );

            setTimeout(
                ()=>{
                    collisionLock = false;
                },
                700
            );

            break;
        }
    }
}

            0,
            game.level - 1

        zombieMaxHp:
            Math.floor(
                z.hp * (1 + scale)
            ),

        zombieHp:
            Math.floor(
                z.hp * (1 + scale)
            ),

        zombieAttack:
            Math.floor(
                z.attack * (1 + scale)
            )

    };

    game.hp =
        getPlayerMaxHp();

    updateBattleUI();

    newQuestion();
}

========================================================= */

function newQuestion(){

    answering = false;

    const category =
        questionBank[
            Math.floor(
                Math.random() *
                questionBank.length
            )
        ];

    const question =
        category.questions[
            Math.floor(
                Math.random() *
                category.questions.length
            )
        ];

    currentQuestion = {

        ...question,
        subject:category.subject

    };

    document.getElementById(
        "subjectText"
    ).textContent =
        currentQuestion.subject;

    document.getElementById(
        "questionDifficultyText"
    ).textContent =
        difficultyName(
            game.difficulty
        );

    document.getElementById(
        "questionText"
    ).textContent =
        currentQuestion.q;

    const answers =
        document.getElementById(
            "answers"
        );

    answers.innerHTML = "";

    currentQuestion.a.forEach(
        (answer,index)=>{

            const btn =
                document.createElement(
                    "button"
                );

            btn.className =
                "answerBtn";

            btn.textContent =
                `${index+1}. ${answer}`;

            btn.onclick =
                function(){

                    answerQuestion(
                        index
                    );
                };

            answers.appendChild(btn);
        }
    );

    updateBattleUI();
}

function difficultyName(d){

    return {

        easy:"🟢 쉬움",

        normal:"🟡 보통",

        hard:"🔴 어려움",

        hell:"💀 지옥"

    }[d];
}

function getDifficultyMultiplier(){

    return {

        easy:1,

        normal:1.5,

        hard:2,

        hell:3

    }[game.difficulty];
}


/* =========================================================
   문제 정답
========================================================= */

function answerQuestion(index){

    /* ⭐ 한 문제 한 번만 */
    if(answering) return;

    if(!currentQuestion) return;

    answering = true;

    /* ⭐ 모든 답 버튼 즉시 잠금 */
    document.querySelectorAll(
        ".answerBtn"
    ).forEach(
        btn => {
            btn.disabled = true;
        }
    );

    game.totalQuestions++;

    const correct =
        index ===
        currentQuestion.answer;

    if(correct){

        game.correctQuestions++;

        combo++;

        if(
            combo >
            game.highestCombo
        ){
            game.highestCombo =
                combo;
        }

        game.dailyQuestProgress
            .questions =
            (game.dailyQuestProgress.questions || 0)
            + 1;

        skillCharge =
            Math.min(
                5,
                skillCharge + 1
            );

        let damage =
            getPlayerAttack();

        damage =
            Math.floor(
                damage *
                getDifficultyMultiplier()
            );

        if(combo >= 3){

            damage =
                Math.floor(
                    damage * 1.2
                );
        }

        let critical = false;

        if(
            Math.random() < .15
        ){

            damage *= 2;
            critical = true;
        }

        const z =
            zombies[
                currentBattle
                    .zombieType
            ];

        if(z.defense){

            damage =
                Math.max(
                    1,
                    damage -
                    z.defense
                );
        }

        currentBattle.zombieHp =
            Math.max(
                0,
                currentBattle.zombieHp -
                damage
            );

        gainXP(
            Math.floor(
                10 *
                getDifficultyMultiplier()
            )
        );

        document.getElementById(
            "battleMessage"
        ).innerHTML =
            `<span class="success">
                ✅ 정답!
                ${critical ? "💥 크리티컬!" : ""}
                ⚔️ ${damage} 피해!
            </span>`;

        attackAnimation();

        updateBattleUI();

        if(
            currentBattle.zombieHp <= 0
        ){

            setTimeout(
                defeatZombie,
                700
            );

        }else{

            setTimeout(
                newQuestion,
                700
            );
        }

    }else{

        combo = 0;

        /* ⭐ 좀비 공격 */
        const damage =
            Math.max(
                1,
                currentBattle.zombieAttack -
                getPlayerDefense()
            );

        game.hp =
            Math.max(
                0,
                game.hp -
                damage
            );

        document.getElementById(
            "battleMessage"
        ).innerHTML =
            `<span class="danger">
                ❌ 오답!
                🧟 좀비가 ${damage}
                피해를 줬습니다.
            </span>`;

        hitAnimation();

        updateBattleUI();

        if(game.hp <= 0){

            setTimeout(
                gameOver,
                700
            );

        }else{

            setTimeout(
                newQuestion,
                1000
            );
        }
    }

    saveSilent();
    updateUI();
}

/* =========================================================
   좀비 처치
========================================================= */

function defeatZombie(){

    const z =
        zombies[
            currentBattle.zombieType
        ];

    const multiplier =
        getDifficultyMultiplier();

    const xp =
        Math.floor(
            z.xp * multiplier
        );

    const coins =
        Math.floor(
            z.coin * multiplier
        );

    gainXP(xp);

    game.coins +=
        coins;

    game.zombiesDefeated++;

    game.dailyQuestProgress
        .zombies =
        (game.dailyQuestProgress.zombies || 0)
        + 1;

    if(
        currentBattle.zombieType ===
        "boss"
    ){

        game.bossesDefeated++;

        game.dailyQuestProgress
            .boss =
            (game.dailyQuestProgress.boss || 0)
            + 1;
    }

    saveSilent();

    showModal(
        "💥 좀비 처치!",
        `${z.name}<br>
        ⭐ +${xp} XP<br>
        🪙 +${coins} 코인`
    );

    setTimeout(
        ()=>{
            closeModal();
            currentBattle = null;
            showMap();
        },
        1000
    );
}


/* =========================================================
   능력치
========================================================= */

function getPlayerAttack(){

    const c =
        characters[
            game.character
        ];

    const w =
        weapons[
            game.weapon
        ];

    return (
        game.baseAttack +
        c.attack +
        w.attack +
        (game.level - 1) * 2
    );
}

function getPlayerDefense(){

    const c =
        characters[
            game.character
        ];

    return (
        game.defense +
        c.defense +
        Math.floor(
            (game.level - 1) / 3
        )
    );
}

function getPlayerMaxHp(){

    const c =
        characters[
            game.character
        ];

    return (
        game.maxHp +
        c.hp +
        (game.level - 1) * 5
    );
}


/* =========================================================
   XP
========================================================= */

function gainXP(amount){

    game.xp += amount;

    while(
        game.xp >= 100
    ){

        game.xp -= 100;

        game.level++;

        game.baseAttack += 2;

        game.maxHp += 5;

        game.defense += 1;

        game.coins += 20;

        showModal(
            "🎉 레벨업!",
            `⭐ Lv.${game.level}<br>
             ⚔️ 공격력 +2<br>
             ❤️ 건강 +5<br>
             🛡️ 방어력 +1<br>
             🪙 +20 코인`
        );
    }
}


/* =========================================================
   필살기
========================================================= */

function useSkill(){

    if(!currentBattle)
        return;

    if(skillCharge < 5){

        showModal(
            "⚡ 필살기",
            `필살기 게이지가 부족합니다.<br>
             현재 ${skillCharge}/5`
        );

        return;
    }

    if(answering){
        return;
    }

    skillCharge = 0;

    const damage =
        getPlayerAttack() * 3;

    currentBattle.zombieHp =
        Math.max(
            0,
            currentBattle.zombieHp -
            damage
        );

    document.getElementById(
        "battleMessage"
    ).innerHTML =
        `<span class="success">
            ⚡ 지식 폭발!
            ${damage} 피해!
        </span>`;

    attackAnimation();

    updateBattleUI();

    if(
        currentBattle.zombieHp <= 0
    ){

        setTimeout(
            defeatZombie,
            500
        );
    }
}

function useHeal(){

    if(healCount <= 0){

        showModal(
            "🧪 회복약",
            "이번 전투의 회복약을 모두 사용했습니다."
        );

        return;
    }

    healCount--;

    game.hp =
        Math.min(
            getPlayerMaxHp(),
            game.hp + 30
        );

    document.getElementById(
        "battleMessage"
    ).innerHTML =
        `<span class="success">
            🧪 건강 30 회복!
        </span>`;

    updateBattleUI();
}

        "battleAttack"

        "playerHpFill"

            game.hp /

        ) + "%";

    document.getElementById(
        "zombieName"
    ).textContent =
        z.name;

    document.getElementById(
        "zombieLevelText"
    ).textContent =
        z.level;

    document.getElementById(
        "zombieHpText"
    ).textContent =

        "zombieMaxHpText"

        "zombieHpFill"

        "fpWeapon"
    ).textContent =
        w.emoji;

    updateUI();
}


/* =========================================================
   캐릭터 상점
========================================================= */

function showCharacters(){

    document.getElementById(
        "mainScreen"
    ).classList.add("hidden");

    document.getElementById(
        "contentScreen"
    ).classList.remove("hidden");

    let html = `
        <h1>🧑‍🎤 캐릭터 상점</h1>
        <div class="cardGrid">
    `;

    Object.entries(
        characters
    ).forEach(
        ([id,c])=>{

            const owned =
                game.ownedCharacters
                    .includes(id);

            const equipped =
                game.character === id;

            html += `

                <div class="card">

                    <h2>${c.emoji}</h2>

                    <h3>${c.name}</h3>

                    <p>
                        ⚔️ 공격 +${c.attack}
                    </p>

                    <p>
                        ❤️ 건강 +${c.hp}
                    </p>

                    <p>
                        🛡️ 방어 +${c.defense}
                    </p>

                    <p class="price">
                        ${
                            c.price === 0
                            ? "무료"
                            : "🪙 " + c.price
                        }
                    </p>

                    ${
                        equipped
                        ?
                        `<button disabled>
                            현재 장착
                         </button>`

                        :

                        owned

                        ?

                        `<button
                            onclick=
                            "equipCharacter('${id}')">
                            장착
                         </button>`

                        :

                        `<button
                            onclick=
                            "buyCharacter('${id}')">
                            구매
                         </button>`
                    }

                </div>
            `;
        }
    );

    html += "</div>";

    document.getElementById(
        "content"
    ).innerHTML =
        html;
}

function buyCharacter(id){

    if(
        game.ownedCharacters
            .includes(id)
    ){
        return;
    }

    const c =
        characters[id];

    if(
        game.coins <
        c.price
    ){

        showModal(
            "🪙 코인 부족",
            "코인이 부족합니다."
        );

        return;
    }

    game.coins -=
        c.price;

    game.ownedCharacters
        .push(id);

    saveSilent();

    showModal(
        "🎉 구매 완료",
        `${c.emoji} ${c.name} 구매 완료!`
    );

    showCharacters();
    updateUI();
}

function equipCharacter(id){

    if(
        !game.ownedCharacters
            .includes(id)
    ){
        return;
    }

    game.character = id;

    game.hp =
        getPlayerMaxHp();

    saveSilent();

    showModal(
        "✅ 장착 완료",
        `${characters[id].name} 장착 완료!`
    );

    showCharacters();
    updateUI();
}

/* =========================================================
   출석
========================================================= */

function showAttendance(){

    document.getElementById(
        "mainScreen"
    ).classList.add("hidden");

    document.getElementById(
        "contentScreen"
    ).classList.remove("hidden");

    const rewards = [
        10,
        15,
        20,
        30,
        40,
        50,
        100
    ];

    let html = `
        <h1>🎁 출석 보상</h1>
        <div class="cardGrid">
    `;

    rewards.forEach(
        (reward,index)=>{

            const day =
                index + 1;

            html += `

                <div class="card">

                    <h3>
                        ${day}일차
                    </h3>

                    <p>
                        🪙 ${reward} 코인
                    </p>

                    ${
                        game.attendance >= day
                        ?
                        "<p>✅ 출석 완료</p>"
                        :
                        "<p>🔒 미달성</p>"
                    }

                </div>
            `;
        }
    );

    html += `
        </div>

        <div class="card">
            <h2>
                🔥 현재 ${game.attendance}일차
            </h2>
        </div>
    `;

    document.getElementById(
        "content"
    ).innerHTML =
        html;
}


/* =========================================================
   전투 나가기
========================================================= */

function exitBattle(){

    const ok =
        confirm(
            "현재 전투를 나갈까요?"
        );

    if(!ok)
        return;

    currentBattle = null;
    currentQuestion = null;

    answering = false;
    combo = 0;

    showMap();
}


/* =========================================================
   게임 오버
========================================================= */

function gameOver(){

    game.hp =
        getPlayerMaxHp();

    combo = 0;

    answering = false;

    saveSilent();

    showModal(
        "💀 GAME OVER",
        "건강이 0이 되었습니다.<br>" +
        "캐릭터와 코인은 유지됩니다."
    );

    setTimeout(
        ()=>{
            closeModal();
            currentBattle = null;
            showMap();
        },
        1200
    );
}


/* =========================================================
   초기화
========================================================= */

function resetGame(){

    const ok =
        confirm(
            "정말 모든 게임 데이터를 초기화할까요?"
        );

    if(!ok)
        return;

    localStorage.removeItem(
        "studyZombieGame"
    );

    location.reload();
}


/* =========================================================
   모달
========================================================= */

function showModal(title,text){

    document.getElementById(
        "modalTitle"
    ).innerHTML =
        title;

    document.getElementById(
        "modalText"
    ).innerHTML =
        text;

    document.getElementById(
        "modal"
    ).classList.remove("hidden");
}

function closeModal(){

    document.getElementById(
        "modal"
    ).classList.add("hidden");
}
